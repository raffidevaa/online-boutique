global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: compose-container-metadata
    static_configs:
      - targets: ["container-metadata-exporter:8081"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
