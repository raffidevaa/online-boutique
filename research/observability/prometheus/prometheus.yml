global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [image]
        regex: '.*/([^/:]+):[^:]+$'
        target_label: service
        replacement: '${1}'

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
